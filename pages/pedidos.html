  <!-- content -->
<div class="container" style="margin-top:40px; max-width:650px;">

    <div class="card">
      <div class="card-content">

        <span class="card-title center">Nuevo Pedido</span>

        <div class="divider"></div>
        <br>
        <form id="form-pedido">

          <div class="input-field">
            <!-- Se agregó name="ListaPlatillos" -->
            <select id="ListaPlatillos" name="ListaPlatillos">
              <option value="" disabled selected>Selecciona un platillo</option>
            </select>
            <label>Platillo</label>
          </div>

          <div class="input-field">
            <!-- Se agregó name="nombre" -->
            <input id="nombre" name="nombre" type="text" required>
            <label for="nombre">Nombre del cliente</label>
          </div>

          <div class="input-field">
            <!-- Se agregó name="direccion" -->
            <input id="direccion" name="direccion" type="text" required>
            <label for="direccion">Dirección</label>
          </div>
          <div class="input-field center">
            <button type="submit" class="btn-small">
              Guardar Pedido
            </button>
          </div>
        </form>
        <div class="input-field center">  
            <button type="button" id="obtenerUbicacion" class="btn-small">
              Obtener ubicación
            </button>
            <!-- SE AGREGÓ EL DIV DEL MAPA FALTANTE PARA EVITAR ERRORES EN JS -->
            <div id="mapa"></div>
          </div>

      </div>
    </div>

  </div>

<!--Base de datos -->
        <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>
        <script src="../js/firebase.js"></script>
        
        <!-- PARCHE PARA CORREGIR ERR_CONNECTION_RESET EN CONEXIONES INESTABLES O RESTRINGIDAS -->
        <script>
          try {
            firebase.firestore().settings({
              experimentalForceLongPolling: true,
              merge: true
            });
          } catch(e) {
            console.log("No se pudo aplicar el parche de red hasta inicializar la app:", e.message);
          }
        </script>

        <script src="../js/pedidos.js"></script>
