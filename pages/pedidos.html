  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">

    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <style>
      #mapa {height: 180px; }
    </style>

  <link rel="stylesheet" href="/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">

  <script src="/js/materialize.min.js"></script>
</head>
<body class="grey lighten-4">

  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">el<span>barrigont</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">elbarrigont</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/about.html" class="waves-effect">About</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contact</a>
    </li>
  </ul>
  
  <!-- content -->
<div class="container" style="margin-top:40px; max-width:650px;">

    <div class="card">
      <div class="card-content">

        <span class="card-title center">Nuevo Pedido</span>

        <div class="divider"></div>
        <br>
        <form id="form-pedido">

          <div class="input-field">
            <!-- Se agregó name="ListaPlatillos" -->
            <select id="ListaPlatillos" name="ListaPlatillos">
              <option value="" disabled selected>Selecciona un platillo</option>
            </select>
            <label>Platillo</label>
          </div>

          <div class="input-field">
            <!-- Se agregó name="nombre" -->
            <input id="nombre" name="nombre" type="text" required>
            <label for="nombre">Nombre del cliente</label>
          </div>

          <div class="input-field">
            <!-- Se agregó name="direccion" -->
            <input id="direccion" name="direccion" type="text" required>
            <label for="direccion">Dirección</label>
          </div>
          <div class="input-field center">
            <button type="submit" class="btn-small">
              Guardar Pedido
            </button>
          </div>
        </form>
        <div class="input-field center">  
            <button type="button" id="obtenerUbicacion" class="btn-small">
              Obtener ubicación
            </button>
            <!-- SE AGREGÓ EL DIV DEL MAPA FALTANTE PARA EVITAR ERRORES EN JS -->
            <div id="mapa"></div>
          </div>

      </div>
    </div>

  </div>

<!--Base de datos -->
        <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>
        <script src="/js/firebase.js"></script>
        
        <!-- PARCHE PARA CORREGIR ERR_CONNECTION_RESET EN CONEXIONES INESTABLES O RESTRINGIDAS -->
        <script>
          try {
            firebase.firestore().settings({
              experimentalForceLongPolling: true,
              merge: true
            });
          } catch(e) {
            console.log("No se pudo aplicar el parche de red hasta inicializar la app:", e.message);
          }
        </script>

        <script src="/js/pedidos.js"></script>
    </body>
</html>
