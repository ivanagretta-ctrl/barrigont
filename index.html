<body class="grey lighten-4">

  <!-- Menú superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/" class="brand-logo">elbarrigont</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu" style="cursor:pointer;">menu</i>
      </span>
    </div>

  <!-- Menú lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">elbarrigont</a></li>
    <li><a href="/" class="waves-effect">Inicio</a></li>
    <li><a href="pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><div class="divider"></div></li>
    <li>
      <a href="pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contacto
      </a>
    </li>
  </ul>

  <!-- Lista de platillos -->
  <div class="recipes container grey-text text-darken-1"></div>

  <div class="center" style="margin-top: 20px;">
    <a class="btn-floating btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- Formulario Agregar platillo -->
  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6>Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="ejemplo: Pizza" id="title" type="text" class="validate">
        <label for="title" class="active">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
        <label for="ingredients" class="active">Ingredientes</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. $50" id="price" type="text" class="validate">
        <label for="price" class="active">Precio</label>
      </div>
      
      <!-- Sección de la cámara -->
      <button id="btnFoto" type="button" class="btn waves-effect waves-light">Imagen</button>
      <div id="camara" style="margin-top: 10px;">
        <video id="video" style="width: 100%; display: none;" autoplay playsinline>No hay video disponible</video>
      </div>
      <canvas id="canvas" style="display: none;"></canvas>
      <div id="salida" style="margin-top: 10px;">
        <img id="foto" src="" alt="Foto del platillo" style="max-width: 100%; display: none;">
      </div>
      
      <div class="input-field center" style="margin-top: 20px;">
        <button type="submit" class="btn-small waves-effect waves-light">Agregar</button>
      </div>
    </form>
  </div>

  <!-- Scripts JS de Materialize, Firebase y Scripts locales -->
  <script type="text/javascript" src="js/materialize.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/index.js"></script>
  <script src="js/db.js"></script>
  
  <!--  cámara  -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btnFoto = document.getElementById("btnFoto");
      const video = document.getElementById("video");

      if (btnFoto && video) {
        btnFoto.addEventListener("click", function(ev) {
          ev.preventDefault();
          navigator.mediaDevices
            .getUserMedia({ video: true, audio: false })
            .then((stream) => {
              video.style.display = "block";
              video.srcObject = stream;
              video.play();
            })
            .catch((err) => {
              console.error("Error al acceder a la cámara:", err);
            });
        });
      }
    });
  </script>
  
  <!-- Registro de Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registrado con éxito:', reg))
        .catch(err => console.error('Error al registrar Service Worker:', err));
    }
  </script>
